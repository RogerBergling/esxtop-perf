name: esxtop-lens

services:
  esxtop-lens:
    image: ghcr.io/rogerbergling/esxtop-perf:latest
    container_name: esxtop-lens
    mem_limit: 2g
    mem_reservation: 256m
    memswap_limit: 2g           # same as mem_limit = no swap
    ports:
      # Loopback-only by default. To expose on the LAN, set
      # ESXTOP_UPLOAD_PASSWORD in .env, change this to "8004:8080", and put
      # HTTPS/reverse-proxy authentication in front. See README.
      - "127.0.0.1:8004:8080"
    restart: unless-stopped
    pull_policy: always
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=2g
    environment:
      ESXTOP_MAX_UPLOAD_MB: "${ESXTOP_MAX_UPLOAD_MB:-512}"
      ESXTOP_MAX_DECOMPRESSED_MB: "${ESXTOP_MAX_DECOMPRESSED_MB:-1536}"
      ESXTOP_MAX_CELLS: "${ESXTOP_MAX_CELLS:-20000000}"
      ESXTOP_MAX_SERIES: "${ESXTOP_MAX_SERIES:-200000}"
      ESXTOP_MAX_ROWS: "${ESXTOP_MAX_ROWS:-50000}"
      ESXTOP_SESSION_TTL_MINUTES: "${ESXTOP_SESSION_TTL_MINUTES:-30}"
      ESXTOP_MAX_SESSIONS: "${ESXTOP_MAX_SESSIONS:-4}"
      ESXTOP_MAX_CONCURRENT_ANALYSES: "${ESXTOP_MAX_CONCURRENT_ANALYSES:-1}"
      # Leave empty for a private instance. Set a strong value in .env before
      # exposing the upload page outside localhost/LAN.
      ESXTOP_UPLOAD_PASSWORD: "${ESXTOP_UPLOAD_PASSWORD:-}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=esxtop"

  # Automatically update the app every 5 minutes. Watchtower mounts the
  # Docker socket, which is host-level privilege. Remove this service if you
  # do not want automatic updates.
  watchtower:
    image: containrrr/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Run `docker login ghcr.io` once to create this file, or remove the
      # line when using the public image without authenticated pulls.
      - ${HOME}/.docker/config.json:/config.json:ro
    environment:
      - DOCKER_API_VERSION=1.44
    labels:
      - "com.centurylinklabs.watchtower.scope=esxtop"
    command: --interval 300 --label-enable --scope esxtop --cleanup
